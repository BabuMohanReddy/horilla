name: Horilla Django CI/CD Pipeline

on:
  push:
    branches: [ "1.0" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/horilla_demo
  TAG: ${{ github.sha }}

jobs:
  ci:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$TAG .
          docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $IMAGE_NAME:$TAG
          format: table
          exit-code: "0"  # Change to "1" to fail on vulnerabilities
          vuln-type: os,library
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=Horilla-Demo
            -Dsonar.python.version=3.11
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: Deploy via Docker Compose (Remote)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Pulling updated Docker image..."
            docker pull $IMAGE_NAME:$TAG

            echo "Stopping and removing existing containers..."
            docker compose -f /home/${{ secrets.REMOTE_USER }}/horilla/docker-compose.yml down || true

            echo "Starting updated containers..."
            docker compose -f /home/${{ secrets.REMOTE_USER }}/horilla/docker-compose.yml up -d --build

            echo "Running Django Migrations..."
            docker exec web python manage.py migrate || true

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Docker containers status:"
            docker ps -a

            echo "Web container logs:"
            docker logs $(docker ps -aqf "name=web")
