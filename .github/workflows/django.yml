name: Horilla Django CI/CD Pipeline

on:
  push:
    branches: [ "1.0" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/horilla_demo
  TAG: ${{ github.sha }}

jobs:
  ci:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$TAG .
          docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          format: table
          exit-code: "0"  # Set to "1" to fail the build on vulnerabilities
          vuln-type: os,library
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=Horilla-Demo
            -Dsonar.python.version=3.11
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            echo "===== Logging in to Docker Hub on EC2 ====="
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "===== Navigating to app directory ====="
            cd /home/${{ secrets.SERVER_USER }}/horilla || exit 1

            echo "===== Pulling updated images from Docker Hub ====="
            docker compose pull

            echo "===== Stopping existing containers ====="
            docker compose down || true

            echo "===== Starting containers with latest image ====="
            docker compose up -d

            echo "===== Running Django migrations ====="
            docker exec web python manage.py migrate || true

            echo "===== Cleaning up unused images ====="
            docker image prune -f

            echo "===== Docker containers status ====="
            docker ps -a

            echo "===== Web container logs ====="
            docker logs web || echo "No logs found for 'web'"
